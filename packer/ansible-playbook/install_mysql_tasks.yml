---
# MySQL Client Installation Tasks via Ansible
# Installs MySQL Client tools using Chocolatey on Windows

- name: Display MySQL Client Installation Starting
  debug:
    msg: |
      ╔════════════════════════════════════════╗
      ║   Installing MySQL Client Tools 8.0    ║
      ╠════════════════════════════════════════╣
      ║ Method: Chocolatey Package Manager
      ║ Tools: mysql, mysqldump, mysqlcheck
      ║ Installation: Client Only
      ╚════════════════════════════════════════╝

# ---------------------------------------------------------------
# Step 1: Install Chocolatey (if not already installed)
# ---------------------------------------------------------------
- name: Check if Chocolatey is installed
  win_command: choco --version
  register: choco_version
  failed_when: false
  ignore_errors: yes

- name: Install Chocolatey
  win_shell: |
    [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
    iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
    Write-Host "Chocolatey installed successfully"
  when: choco_version.rc != 0
  register: choco_install

- name: Display Chocolatey installation status
  debug:
    msg: "Chocolatey {{ 'installed' if choco_version.rc != 0 else 'already installed' }}"

# ---------------------------------------------------------------
# Step 2: Install MySQL Client via Chocolatey
# ---------------------------------------------------------------
- name: Install MySQL Client via Chocolatey
  win_chocolatey:
    name: mysql
    state: present
  register: mysql_install

- name: MySQL client installation confirmed
  debug:
    msg: "MySQL client installed successfully"

# ---------------------------------------------------------------
# Step 3: Verify installation
# ---------------------------------------------------------------
- name: Verify mysql is available
  win_command: mysql --version
  register: mysql_version
  failed_when: false
  ignore_errors: yes

- name: Display MySQL Client version
  debug:
    msg: "MySQL Client version: {{ mysql_version.stdout | default('Unable to determine version') }}"

- name: Verify mysqldump is available
  win_command: mysqldump --version
  register: mysqldump_check
  failed_when: false
  ignore_errors: yes

- name: Display mysqldump version
  debug:
    msg: "mysqldump version: {{ mysqldump_check.stdout | default('Unable to determine version') }}"

- name: Display MySQL Client Installation Complete
  debug:
    msg: |
      ╔════════════════════════════════════════╗
      ║   MySQL Client Installation Complete   ║
      ╠════════════════════════════════════════╣
      ║ ✓ Installation Method: Chocolatey
      ║ ✓ Tools: mysql, mysqldump, mysqlcheck
      ║ ✓ PATH: Automatically configured
      ║ Status: SUCCESS
      ╚════════════════════════════════════════╝

      Next steps:
      1. Run: mysql -h <hostname> -u <username> -p
      2. Test: mysql --version
      3. Backup: mysqldump -u <user> -h <host> -p <database> > backup.sql