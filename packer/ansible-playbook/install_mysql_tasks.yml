---
# MySQL Installation Tasks via Ansible
# Downloads and installs MySQL Server 8.0 on Windows

- name: Display MySQL Installation Starting
  debug:
    msg: |
      ╔════════════════════════════════════════╗
      ║   Installing MySQL Server 8.0          ║
      ╠════════════════════════════════════════╣
      ║ Download: MySQL Community Edition 8.0
      ║ Port: 3306
      ║ Service: MySQL80
      ╚════════════════════════════════════════╝

- name: Create temporary directory for MySQL download
  win_file:
    path: "C:\\Temp"
    state: directory

- name: Download MySQL 8.0 installer
  win_get_url:
    url: "https://dev.mysql.com/get/Downloads/MySQL-8.0/mysql-8.0.36-winx64.msi"
    dest: "C:\\Temp\\mysql-installer.msi"
    timeout: 300
  register: mysql_download
  failed_when: mysql_download.failed

- name: Verify MySQL installer downloaded
  win_stat:
    path: "C:\\Temp\\mysql-installer.msi"
  register: mysql_installer_stat
  failed_when: not mysql_installer_stat.stat.exists

- name: Install MySQL via MSI
  win_package:
    path: "C:\\Temp\\mysql-installer.msi"
    product_id: "MySQL 8.0"
    state: present
    arguments: 
      - "INSTALLDIR=C:\\Program Files\\MySQL\\MySQL Server 8.0"
      - "PORT=3306"
      - "SKIPINITDB=1"
  register: mysql_install
  failed_when: mysql_install.failed

- name: Create MySQL service
  win_service:
    name: MySQL80
    display_name: "MySQL80"
    path: "C:\\Program Files\\MySQL\\MySQL Server 8.0\\bin\\mysqld.exe"
    state: started
    start_mode: auto
  register: mysql_service
  failed_when: mysql_service.failed

- name: Verify MySQL service is running
  win_service_info:
    name: MySQL80
  register: mysql_service_info

- name: Display MySQL service status
  debug:
    msg: "MySQL80 service status: {{ mysql_service_info.services[0].state }}"

- name: Configure Windows Firewall for MySQL
  win_firewall_rule:
    name: "MySQL on port 3306"
    direction: in
    action: allow
    protocol: tcp
    localport: 3306
    state: present
    enabled: yes

- name: Verify MySQL connectivity on port 3306
  win_telnet:
    host: localhost
    port: 3306
  register: mysql_port_check
  failed_when: mysql_port_check.failed
  retries: 3
  delay: 5

- name: Remove MySQL installer
  win_file:
    path: "C:\\Temp\\mysql-installer.msi"
    state: absent

- name: Display MySQL Installation Complete
  debug:
    msg: |
      ╔════════════════════════════════════════╗
      ║   MySQL Installation Complete          ║
      ╠════════════════════════════════════════╣
      ║ ✓ Service: MySQL80 (Running)
      ║ ✓ Port: 3306 (Firewall Open)
      ║ ✓ Auto-start: Enabled
      ║ Status: SUCCESS
      ╚════════════════════════════════════════╝
