---
# Oracle Client Installation Tasks via Ansible
# Downloads Oracle Instant Client 19.30 from GCS bucket and installs on Windows

- name: Display Oracle Client Installation Starting
  debug:
    msg: |
      ╔════════════════════════════════════════╗
      ║   Installing Oracle Client 19.30       ║
      ╠════════════════════════════════════════╣
      ║ Source: GCS Bucket
      ║ Package: Instant Client Basic 19.30
      ║ Installation: Client Only
      ╚════════════════════════════════════════╝

# ---------------------------------------------------------------
# Step 1: Create required directories
# ---------------------------------------------------------------
- name: Create required directories
  win_file:
    path: "{{ item }}"
    state: directory
  loop:
    - "C:\\Temp"
    - "C:\\Temp\\oracle_extract"
    - "C:\\Oracle\\client"
    - "C:\\Oracle\\client\\network\\admin"

# ---------------------------------------------------------------
# Step 2: Download Oracle Instant Client from GCS bucket
# ---------------------------------------------------------------
- name: Download Oracle Instant Client from GCS bucket
  win_shell: |
    $dest = "C:\Temp\oracle-client.zip"
    $url = "https://storage.googleapis.com/org-sec-agents-bucket/oracle/instantclient-basic-windows.x64-19.30.0.0.0dbru.zip"
    Write-Host "Downloading Oracle Instant Client from GCS..."
    $client = New-Object System.Net.WebClient
    $client.DownloadFile($url, $dest)
    Write-Host "Download complete"
  register: oracle_download
  failed_when: oracle_download.rc != 0

- name: Verify Oracle zip downloaded
  win_stat:
    path: "C:\\Temp\\oracle-client.zip"
  register: oracle_zip_stat
  failed_when: not oracle_zip_stat.stat.exists

# ---------------------------------------------------------------
# Step 3: Extract and install
# ---------------------------------------------------------------
- name: Extract Oracle Instant Client
  win_shell: |
    Expand-Archive -Path "C:\Temp\oracle-client.zip" -DestinationPath "C:\Temp\oracle_extract" -Force
    Write-Host "Extraction complete"
  register: oracle_extract
  failed_when: oracle_extract.rc != 0

- name: Find extracted Oracle directory
  win_find:
    path: "C:\\Temp\\oracle_extract"
    patterns: "instantclient*"
    file_type: directory
    recurse: no
  register: oracle_extracted_dir
  failed_when: oracle_extracted_dir.files | length == 0

- name: Copy Oracle Client files to installation directory
  win_shell: |
    $src = "{{ oracle_extracted_dir.files[0].path }}"
    Get-ChildItem -Path $src | Copy-Item -Destination "C:\Oracle\client" -Recurse -Force
    Write-Host "Oracle Client files copied to C:\Oracle\client"
  register: oracle_copy
  failed_when: oracle_copy.rc != 0

# ---------------------------------------------------------------
# Step 4: Set environment variables
# ---------------------------------------------------------------
- name: Set ORACLE_HOME environment variable
  win_shell: |
    [Environment]::SetEnvironmentVariable('ORACLE_HOME', 'C:\Oracle\client', 'Machine')
    Write-Host "ORACLE_HOME set to C:\Oracle\client"

- name: Set TNS_ADMIN environment variable
  win_shell: |
    [Environment]::SetEnvironmentVariable('TNS_ADMIN', 'C:\Oracle\client\network\admin', 'Machine')
    Write-Host "TNS_ADMIN set to C:\Oracle\client\network\admin"

- name: Add Oracle Client to system PATH
  win_shell: |
    $path = [Environment]::GetEnvironmentVariable('PATH', 'Machine')
    if ($path -notlike '*Oracle*client*') {
      [Environment]::SetEnvironmentVariable('PATH', $path + ';C:\Oracle\client', 'Machine')
      Write-Host "PATH updated with Oracle client"
    } else {
      Write-Host "PATH already contains Oracle client"
    }

# ---------------------------------------------------------------
# Step 5: Cleanup temp files
# ---------------------------------------------------------------
- name: Remove temporary files
  win_file:
    path: "{{ item }}"
    state: absent
  loop:
    - "C:\\Temp\\oracle-client.zip"
    - "C:\\Temp\\oracle_extract"
  failed_when: false

# ---------------------------------------------------------------
# Step 6: Verify installation
# ---------------------------------------------------------------
- name: Verify Oracle client directory has files
  win_find:
    path: "C:\\Oracle\\client"
    patterns: "*.dll"
    recurse: no
  register: oracle_dlls
  failed_when: oracle_dlls.files | length == 0

- name: Display Oracle Client Installation Complete
  debug:
    msg: |
      ╔════════════════════════════════════════╗
      ║   Oracle Client Installation Complete  ║
      ╠════════════════════════════════════════╣
      ║ ✓ Location: C:\Oracle\client\
      ║ ✓ ORACLE_HOME: C:\Oracle\client
      ║ ✓ TNS_ADMIN: C:\Oracle\client\network\admin
      ║ ✓ PATH: Updated (System-wide)
      ║ Status: SUCCESS
      ╚════════════════════════════════════════╝

      Next steps:
      1. Add tnsnames.ora to C:\Oracle\client\network\admin\
      2. Configure your application to use ORACLE_HOME