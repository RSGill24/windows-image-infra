substitutions:
  _PROJECT_ID: "big-mender-473219-r2"
  _SOURCE_IMAGE_PROJECT_ID: "windows-cloud"
  _SOURCE_IMAGE_FAMILY: "windows-2022"
  _ZONE: "us-east4-b"
  _IMAGE_FAMILY: "pww-windows-2022-hardened"
  _SOURCE_IMAGE: "ws2022"
  _WINRM_SECRET: "packer-winrm-password"
  _PACKER_TEMPLATE: "harden_ww.pkr.hcl"
  _PACKER_VERSION: "1.9.4"
  _HARDENING_SOURCE_DIR: "./scripts"
  _HARDENING_TARGET_DIR: "C:/Users/packer_user/hardening/"
  _MACHINE_TYPE: "e2-standard-8"
  _TRIVY_VERSION: "0.61.1"
  _SEVERITY: "HIGH,CRITICAL"
  _REGION: "us-east4"
  _AR_REPO: "packer-images"
  _IMAGE_NAME: "windows-packer-builder"
  _VPC_NETWORK: "app-network"
  _VPC_CONNECTOR: "packer-connector"
  _VPC_CONNECTOR_RANGE: "10.8.0.0/28"
  _CLOUD_RUN_JOB: "windows-image-build"

steps:

# ── Step 1: Trivy Security Scans ─────────────────────────────

- id: 'trivy-config-scan'
  name: 'aquasec/trivy:${_TRIVY_VERSION}'
  entrypoint: sh
  args:
  - -c
  - |
      set -e

      echo "=== Trivy Config Scan — Packer HCL ==="
      trivy config \
        --severity ${_SEVERITY} \
        --exit-code 0 \
        --format table \
        ./win2022-dev/packer || true

      echo "=== Trivy Filesystem Scan — Secrets ==="
      trivy fs \
        --scanners secret \
        --severity ${_SEVERITY} \
        --exit-code 0 \
        --format table \
        ./win2022-dev/packer/scripts || true

      echo "=== Trivy Filesystem Scan — Vulnerabilities ==="
      trivy fs \
        --scanners vuln \
        --severity ${_SEVERITY} \
        --exit-code 0 \
        --format table \
        ./win2022-dev/packer/scripts || true

      echo "=== Trivy scan complete ==="

# ── Step 2: Build Docker Image ────────────────────────────────

- id: 'docker-build'
  name: 'gcr.io/cloud-builders/docker'
  entrypoint: bash
  args:
  - -c
  - |
      set -euo pipefail

      IMAGE_TAG="${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}"

      echo "Building Docker image: $$IMAGE_TAG"

      docker build \
        --build-arg PACKER_VERSION=${_PACKER_VERSION} \
        --tag "$$IMAGE_TAG:$SHORT_SHA" \
        --tag "$$IMAGE_TAG:latest" \
        --file ./win2022-dev/Dockerfile \
        ./win2022-dev

      echo "Docker build complete."

# ── Step 3: Configure Artifact Registry Auth ─────────────────

- id: 'configure-docker-auth'
  name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: bash
  args:
  - -c
  - |
      set -euo pipefail
      echo "Configuring Docker auth for Artifact Registry..."
      gcloud auth configure-docker ${_REGION}-docker.pkg.dev --quiet
      echo "Auth configured."

# ── Step 4: Push Docker Image to Artifact Registry ────────────

- id: 'docker-push'
  name: 'gcr.io/cloud-builders/docker'
  args:
  - push
  - '--all-tags'
  - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}'

# ── Step 5: Ensure VPC Connector Exists ──────────────────────
# FIX: Cloud Run Job needs a VPC connector to reach the internal
# subnet (app-subnet1) where the Packer VM is created.
# Without this, IAP tunnel opens but WinRM traffic can't route
# to the VM → causes "401 - invalid content type".

- id: 'ensure-vpc-connector'
  name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: bash
  args:
  - -c
  - |
      set -euo pipefail

      echo "Checking VPC connector: ${_VPC_CONNECTOR}..."

      EXISTS=$(gcloud compute networks vpc-access connectors describe ${_VPC_CONNECTOR} \
        --region=${_REGION} \
        --project=${_PROJECT_ID} \
        --format="value(name)" 2>/dev/null || echo "")

      if [ -z "$$EXISTS" ]; then
        echo "VPC connector not found. Creating..."
        gcloud compute networks vpc-access connectors create ${_VPC_CONNECTOR} \
          --region=${_REGION} \
          --network=${_VPC_NETWORK} \
          --range=${_VPC_CONNECTOR_RANGE} \
          --project=${_PROJECT_ID} \
          --min-instances=2 \
          --max-instances=3 \
          --machine-type=e2-micro
        echo "VPC connector created."
      else
        echo "VPC connector already exists: $$EXISTS"
      fi

# ── Step 6: Update Cloud Run Job with VPC + latest image ─────
# FIX: Wires the VPC connector to the Cloud Run Job so Packer
# can reach the internal VM through IAP tunnel correctly.
# Also updates the job image to the freshly built version.

- id: 'update-cloud-run-job'
  name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: bash
  args:
  - -c
  - |
      set -euo pipefail

      IMAGE_TAG="${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:$SHORT_SHA"

      echo "Updating Cloud Run Job: ${_CLOUD_RUN_JOB}..."

      # Check if job exists
      JOB_EXISTS=$(gcloud run jobs describe ${_CLOUD_RUN_JOB} \
        --region=${_REGION} \
        --project=${_PROJECT_ID} \
        --format="value(name)" 2>/dev/null || echo "")

      if [ -z "$$JOB_EXISTS" ]; then
        echo "Cloud Run Job not found. Creating..."
        gcloud run jobs create ${_CLOUD_RUN_JOB} \
          --image="$$IMAGE_TAG" \
          --region=${_REGION} \
          --project=${_PROJECT_ID} \
          --service-account="packer-win-sa@${_PROJECT_ID}.iam.gserviceaccount.com" \
          --vpc-connector=${_VPC_CONNECTOR} \
          --vpc-egress=all-traffic \
          --memory=2Gi \
          --cpu=2 \
          --task-timeout=7200 \
          --max-retries=0 \
          --set-env-vars="PROJECT_ID=${_PROJECT_ID}" \
          --set-env-vars="SOURCE_IMAGE_PROJECT_ID=${_SOURCE_IMAGE_PROJECT_ID}" \
          --set-env-vars="SOURCE_IMAGE_FAMILY=${_SOURCE_IMAGE_FAMILY}" \
          --set-env-vars="IMAGE_FAMILY=${_IMAGE_FAMILY}" \
          --set-env-vars="ZONE=${_ZONE}" \
          --set-env-vars="MACHINE_TYPE=${_MACHINE_TYPE}" \
          --set-env-vars="SERVICE_ACCOUNT_EMAIL=packer-win-sa@${_PROJECT_ID}.iam.gserviceaccount.com" \
          --set-env-vars="HARDENING_TARGET_DIR=${_HARDENING_TARGET_DIR}" \
          --set-env-vars="PACKER_TEMPLATE=${_PACKER_TEMPLATE}" \
          --set-secrets="WINRM_SECRET=${_WINRM_SECRET}:latest"
        echo "Cloud Run Job created."
      else
        echo "Updating existing Cloud Run Job..."
        gcloud run jobs update ${_CLOUD_RUN_JOB} \
          --image="$$IMAGE_TAG" \
          --region=${_REGION} \
          --project=${_PROJECT_ID} \
          --service-account="packer-win-sa@${_PROJECT_ID}.iam.gserviceaccount.com" \
          --vpc-connector=${_VPC_CONNECTOR} \
          --vpc-egress=all-traffic \
          --memory=2Gi \
          --cpu=2 \
          --task-timeout=7200 \
          --max-retries=0
        echo "Cloud Run Job updated."
      fi

      echo "Cloud Run Job ready. Trigger manually from GCP Console → Cloud Run → Jobs → ${_CLOUD_RUN_JOB} → Execute"

# ── Images stored in Artifact Registry ───────────────────────
images:
  - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:latest'

# ── Service Account & Options ─────────────────────────────────
serviceAccount: "packer-win-sa@${_PROJECT_ID}.iam.gserviceaccount.com"

options:
  logging: CLOUD_LOGGING_ONLY