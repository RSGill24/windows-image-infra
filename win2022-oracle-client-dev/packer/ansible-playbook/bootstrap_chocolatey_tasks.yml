---
# ──────────────────────────────────────────────────────────────────────────────
# bootstrap_chocolatey_tasks.yml
#
# Chocolatey is pre-installed by Packer's native PowerShell provisioner.
# This task file only verifies it exists before proceeding.
# ──────────────────────────────────────────────────────────────────────────────

- name: Verify Chocolatey is available
  win_stat:
    path: "C:\\ProgramData\\chocolatey\\bin\\choco.exe"
  register: choco_stat
  failed_when: not choco_stat.stat.exists

- name: Refresh PATH for Chocolatey
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('PATH', 'User')
    choco --version
  register: choco_ver
  changed_when: false

- name: Log Chocolatey version
  debug:
    msg: "Chocolatey version: {{ choco_ver.stdout | trim }}"
