---
# ──────────────────────────────────────────────────────────────────────────────
# install_chrome_tasks.yml – Google Chrome via Chocolatey
#
# Standard Ansible Windows modules: win_shell, win_stat, win_copy, win_find,
# win_file, win_command, debug
# ──────────────────────────────────────────────────────────────────────────────

- name: Bootstrap Chocolatey (Chrome)
  include_tasks: bootstrap_chocolatey_tasks.yml

- name: Check if Chrome is already installed
  win_stat:
    path: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
  register: chrome_stat
  changed_when: false

- name: Install Google Chrome via Chocolatey
  when: not chrome_stat.stat.exists
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    choco install googlechrome --yes --no-progress --limit-output --ignore-checksums
    if ($LASTEXITCODE -ne 0) { throw "Installation failed" }
  register: chrome_install
  failed_when: chrome_install.rc != 0

- name: Verify Chrome binary exists
  win_stat:
    path: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
  register: chrome_bin
  changed_when: false
  failed_when: not chrome_bin.stat.exists

- name: Log Chrome installation success
  debug:
    msg: "Google Chrome installed successfully"

- name: Clear Chocolatey download cache
  win_shell: |
    choco cache remove --all --yes --no-progress 2>$null
  failed_when: false
  changed_when: false
