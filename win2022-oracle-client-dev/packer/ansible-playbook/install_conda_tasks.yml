---
# ──────────────────────────────────────────────────────────────────────────────
# install_conda_tasks.yml
#
# Installs Miniconda3 (conda + Python) on Windows via Chocolatey.
# Prerequisites satisfied via shared bootstrap:
#   1. Chocolatey bootstrap (idempotent – skipped if already present)
#   2. Miniconda3
#   3. PATH / CONDA_HOME env vars
#   4. conda-forge channel added, conda updated
#
# Standard Ansible Windows modules: win_shell, win_stat, win_copy, win_find,
# win_file, win_command, debug
# ──────────────────────────────────────────────────────────────────────────────

# ── 1. Chocolatey bootstrap ────────────────────────────────────────────────────
- name: Bootstrap Chocolatey (Conda)
  include_tasks: bootstrap_chocolatey_tasks.yml

# ── 2. Miniconda3 ─────────────────────────────────────────────────────────────
- name: Check if Miniconda3 is already installed
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    $conda = Get-Command conda -ErrorAction SilentlyContinue
    if ($conda) { echo "installed" } else {
      $paths = @('C:\tools\miniconda3\Scripts\conda.exe', 'C:\ProgramData\miniconda3\Scripts\conda.exe')
      foreach ($p in $paths) { if (Test-Path $p) { echo "installed"; exit 0 } }
      echo "not_installed"
    }
  register: conda_stat
  changed_when: false

- name: Install Miniconda3 via Chocolatey
  when: "'not_installed' in conda_stat.stdout"
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    choco install miniconda3 --yes --no-progress --limit-output --params "'/AddToPath:1 /RegisterPython:1 /InstallationType:AllUsers'"
    if ($LASTEXITCODE -ne 0) { throw "Installation failed" }
  register: conda_install
  failed_when: conda_install.rc != 0

- name: Verify conda binary exists
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    $conda = Get-Command conda -ErrorAction SilentlyContinue
    if ($conda) { echo $conda.Source } else {
      $paths = @('C:\tools\miniconda3\Scripts\conda.exe', 'C:\ProgramData\miniconda3\Scripts\conda.exe', 'C:\miniconda3\Scripts\conda.exe')
      foreach ($p in $paths) { if (Test-Path $p) { echo $p; exit 0 } }
      throw "conda.exe not found"
    }
  register: conda_bin
  changed_when: false

# ── 3. Environment variables ──────────────────────────────────────────────────
- name: Set CONDA_HOME machine environment variable
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    [Environment]::SetEnvironmentVariable('CONDA_HOME', 'C:\tools\miniconda3', 'Machine')

- name: Add conda to system PATH (base, Scripts, Library\bin)
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    $condaRoot  = "C:\tools\miniconda3"
    $addPaths   = @(
      $condaRoot,
      "$condaRoot\Scripts",
      "$condaRoot\Library\bin"
    )
    $currentPath = [Environment]::GetEnvironmentVariable('PATH', 'Machine')
    $pathParts   = $currentPath -split ';'
    foreach ($p in $addPaths) {
      if ($pathParts -notcontains $p) {
        $currentPath = "$currentPath;$p"
      }
    }
    [Environment]::SetEnvironmentVariable('PATH', $currentPath, 'Machine')
  changed_when: false

# ── 4. Initialise conda & add conda-forge ─────────────────────────────────────
- name: Initialise conda shell hooks (PowerShell)
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    $conda = "C:\tools\miniconda3\Scripts\conda.exe"
    & $conda init powershell --all --quiet
  failed_when: false
  changed_when: false

- name: Add conda-forge channel
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    $conda = "C:\tools\miniconda3\Scripts\conda.exe"
    & $conda config --system --add channels conda-forge
    & $conda config --system --set channel_priority strict
  register: conda_forge
  changed_when: false

  # Skipped: conda update is memory-heavy during image build and failed with CondaMemoryError.
  # Miniconda installed by Chocolatey is sufficient.
- name: Verify conda version
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    & 'C:\tools\miniconda3\Scripts\conda.exe' --version
  register: conda_version
  changed_when: false

- name: Log conda version
  debug:
    msg: "Conda version: {{ conda_version.stdout | trim }}"

- name: Verify Python version bundled with conda
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    & 'C:\tools\miniconda3\python.exe' --version
  register: py_version
  changed_when: false

- name: Log Python version
  debug:
    msg: "Python version: {{ py_version.stdout | trim }}"

# ── 5. Cleanup ─────────────────────────────────────────────────────────────────
- name: Clean conda package cache
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    & "C:\tools\miniconda3\Scripts\conda.exe" clean --all --yes --quiet
  failed_when: false
  changed_when: false

- name: Clear Chocolatey download cache
  win_shell: |
    choco cache remove --all --yes --no-progress 2>$null
  failed_when: false
  changed_when: false
