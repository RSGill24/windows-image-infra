---
# ──────────────────────────────────────────────────────────────────────────────
# install_echosms_tasks.yml – EchoSMs (binary from GCS)
#
# Requires: Installer uploaded to gs://org-sec-agents-bucket/echosms/
#
# Standard Ansible Windows modules: win_shell, win_stat, win_copy, win_find,
# win_file, win_command, debug
# ──────────────────────────────────────────────────────────────────────────────

- name: Create EchoSMs temp directory
  win_file:
    path: "C:\\Temp\\echosms"
    state: directory

- name: Check if EchoSMs is already installed
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    $es = Get-ChildItem "C:\Program Files\EchoSMs" -ErrorAction SilentlyContinue
    $es2 = Get-ChildItem "C:\Program Files (x86)\EchoSMs" -ErrorAction SilentlyContinue
    if ($es -or $es2) { Write-Output "installed" } else { Write-Output "not_installed" }
  register: echosms_check
  changed_when: false

- name: Download EchoSMs installer from GCS
  when: "'not_installed' in echosms_check.stdout"
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    gsutil cp gs://org-sec-agents-bucket/echosms/EchoSMsSetup.exe C:\Temp\echosms\EchoSMsSetup.exe
    if ($LASTEXITCODE -ne 0) { throw "Download failed" }
  register: echosms_download

- name: Install EchoSMs silently
  when: "'not_installed' in echosms_check.stdout"
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    Start-Process -FilePath "C:\Temp\echosms\EchoSMsSetup.exe" -ArgumentList "/S" -Wait -NoNewWindow
    if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) { throw "Installation failed" }
  register: echosms_install

- name: Verify EchoSMs installation
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    $es = Get-ChildItem "C:\Program Files" -Filter "EchoSMs*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
    if (-not $es) {
      $es = Get-ChildItem "C:\Program Files (x86)" -Filter "EchoSMs*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
    }
    if (-not $es) { exit 1 }
    Write-Output "EchoSMs installed at $($es.FullName)"
  register: echosms_verify
  changed_when: false

- name: Log EchoSMs installation
  debug:
    msg: "{{ echosms_verify.stdout | trim }}"

- name: Clean up EchoSMs temp files
  win_file:
    path: "C:\\Temp\\echosms"
    state: absent
  failed_when: false
