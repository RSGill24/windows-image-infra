---
# ──────────────────────────────────────────────────────────────────────────────
# install_echostack_tasks.yml – EchoStack (binary from GCS)
#
# Requires: Installer uploaded to gs://org-sec-agents-bucket/echostack/
#
# Standard Ansible Windows modules: win_shell, win_stat, win_copy, win_find,
# win_file, win_command, debug
# ──────────────────────────────────────────────────────────────────────────────

- name: Create EchoStack temp directory
  win_file:
    path: "C:\\Temp\\echostack"
    state: directory

- name: Check if EchoStack is already installed
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    $es = Get-ChildItem "C:\Program Files\EchoStack" -ErrorAction SilentlyContinue
    $es2 = Get-ChildItem "C:\Program Files (x86)\EchoStack" -ErrorAction SilentlyContinue
    if ($es -or $es2) { Write-Output "installed" } else { Write-Output "not_installed" }
  register: echostack_check
  changed_when: false

- name: Download EchoStack installer from GCS
  when: "'not_installed' in echostack_check.stdout"
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    gsutil cp gs://org-sec-agents-bucket/echostack/EchoStackSetup.exe C:\Temp\echostack\EchoStackSetup.exe
    if ($LASTEXITCODE -ne 0) { throw "Download failed" }
  register: echostack_download

- name: Install EchoStack silently
  when: "'not_installed' in echostack_check.stdout"
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    Start-Process -FilePath "C:\Temp\echostack\EchoStackSetup.exe" -ArgumentList "/S" -Wait -NoNewWindow
    if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) { throw "Installation failed" }
  register: echostack_install

- name: Verify EchoStack installation
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    $es = Get-ChildItem "C:\Program Files" -Filter "EchoStack*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
    if (-not $es) {
      $es = Get-ChildItem "C:\Program Files (x86)" -Filter "EchoStack*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
    }
    if (-not $es) { exit 1 }
    Write-Output "EchoStack installed at $($es.FullName)"
  register: echostack_verify
  changed_when: false

- name: Log EchoStack installation
  debug:
    msg: "{{ echostack_verify.stdout | trim }}"

- name: Clean up EchoStack temp files
  win_file:
    path: "C:\\Temp\\echostack"
    state: absent
  failed_when: false
