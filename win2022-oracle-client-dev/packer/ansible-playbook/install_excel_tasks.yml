---
# ──────────────────────────────────────────────────────────────────────────────
# install_excel_tasks.yml – Microsoft Excel (Office deployment from GCS)
#
# Requires:
#   - Office Deployment Tool + config: gs://org-sec-agents-bucket/office/
#   - configuration.xml should specify Excel-only install:
#       <Add OfficeClientEdition="64">
#         <Product ID="O365ProPlusRetail">
#           <ExcludeApp ID="..." />  (exclude all except Excel)
#         </Product>
#       </Add>
#
# Standard Ansible Windows modules: win_shell, win_stat, win_copy, win_find,
# win_file, win_command, debug
# ──────────────────────────────────────────────────────────────────────────────

- name: Create Office temp directory
  win_file:
    path: "C:\\Temp\\office"
    state: directory

- name: Check if Microsoft Excel is already installed
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    $excel = Get-ChildItem "C:\Program Files\Microsoft Office" -Filter "EXCEL.EXE" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
    $excel2 = Get-ChildItem "C:\Program Files (x86)\Microsoft Office" -Filter "EXCEL.EXE" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
    if ($excel -or $excel2) { Write-Output "installed" } else { Write-Output "not_installed" }
  register: excel_check
  changed_when: false

- name: Download Office Deployment Tool from GCS
  when: "'not_installed' in excel_check.stdout"
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    gsutil cp gs://org-sec-agents-bucket/office/officedeploymenttool.exe C:\Temp\office\officedeploymenttool.exe
    if ($LASTEXITCODE -ne 0) { throw "Download failed" }
  register: odt_download

- name: Download Office configuration XML from GCS
  when: "'not_installed' in excel_check.stdout"
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    gsutil cp gs://org-sec-agents-bucket/office/configuration.xml C:\Temp\office\configuration.xml
    if ($LASTEXITCODE -ne 0) { throw "Download failed" }
  register: odt_config_download

- name: Extract Office Deployment Tool
  when: "'not_installed' in excel_check.stdout"
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    Start-Process -FilePath "C:\Temp\office\officedeploymenttool.exe" -ArgumentList "/quiet", "/extract:C:\Temp\office" -Wait -NoNewWindow

- name: Download Office binaries using ODT
  when: "'not_installed' in excel_check.stdout"
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    Start-Process -FilePath "C:\Temp\office\setup.exe" -ArgumentList "/download", "C:\Temp\office\configuration.xml" -Wait -NoNewWindow
    if ($LASTEXITCODE -ne 0) { throw "Download failed" }
  register: office_download

- name: Install Microsoft Excel via ODT
  when: "'not_installed' in excel_check.stdout"
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    Start-Process -FilePath "C:\Temp\office\setup.exe" -ArgumentList "/configure", "C:\Temp\office\configuration.xml" -Wait -NoNewWindow
    if ($LASTEXITCODE -ne 0) { throw "Installation failed" }
  register: office_install

- name: Verify Microsoft Excel installation
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    $excel = Get-ChildItem "C:\Program Files" -Filter "EXCEL.EXE" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
    if (-not $excel) { exit 1 }
    Write-Output $excel.FullName
  register: excel_bin
  changed_when: false

- name: Log Excel installation success
  debug:
    msg: "Microsoft Excel installed at: {{ excel_bin.stdout | trim }}"

- name: Clean up Office temp files
  win_file:
    path: "C:\\Temp\\office"
    state: absent
  failed_when: false
