---
# ──────────────────────────────────────────────────────────────────────────────
# install_gcp_utilities_tasks.yml – GCP Cloud Utilities (Google Cloud SDK)
#
# Note: GCP SDK may already be present from the Phase 1 golden image.
# This task ensures it is installed and up to date.
# ──────────────────────────────────────────────────────────────────────────────

- name: Check if Google Cloud SDK is already installed
  win_shell: |
    $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH", "Machine") + ";" + $env:PATH
    gcloud version --format="value(Google Cloud SDK)" 2>$null
    if ($LASTEXITCODE -ne 0) { echo "not_installed" }
  register: gcloud_check
  changed_when: false
  failed_when: false

- name: Download Google Cloud SDK installer
  when: "'not_installed' in gcloud_check.stdout"
  win_shell: |
    $client = New-Object System.Net.WebClient
    $client.DownloadFile("https://dl.google.com/dl/cloudsdk/channels/rapid/GoogleCloudSDKInstaller.exe", "C:\Temp\GoogleCloudSDKInstaller.exe")
  register: gcloud_download

- name: Install Google Cloud SDK silently
  when: "'not_installed' in gcloud_check.stdout"
  win_shell: |
    Start-Process -FilePath "C:\Temp\GoogleCloudSDKInstaller.exe" -ArgumentList "/S", "/allusers" -Wait -NoNewWindow

- name: Verify Google Cloud SDK installation
  win_shell: |
    $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH", "Machine") + ";" + $env:PATH
    gcloud version
  register: gcloud_version
  failed_when: gcloud_version.rc != 0
  changed_when: false

- name: Log GCP Cloud SDK version
  debug:
    msg: "{{ gcloud_version.stdout_lines[0] | default('GCP Cloud SDK installed') }}"

- name: Clean up SDK installer
  win_file:
    path: "C:\\Temp\\GoogleCloudSDKInstaller.exe"
    state: absent
  failed_when: false
