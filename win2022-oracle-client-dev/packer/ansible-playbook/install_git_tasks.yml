---
# ──────────────────────────────────────────────────────────────────────────────
# install_git_tasks.yml – Git + GitHub Desktop via Chocolatey
#
# Standard Ansible Windows modules: win_shell, win_stat, win_copy, win_find,
# win_file, win_command, debug
# ──────────────────────────────────────────────────────────────────────────────

- name: Bootstrap Chocolatey (Git)
  include_tasks: bootstrap_chocolatey_tasks.yml

# ── Git ──────────────────────────────────────────────────────────────────────
- name: Check if Git is already installed
  win_stat:
    path: "C:\\Program Files\\Git\\cmd\\git.exe"
  register: git_stat
  changed_when: false

- name: Install Git via Chocolatey
  when: not git_stat.stat.exists
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    choco install git --yes --no-progress --limit-output
    if ($LASTEXITCODE -ne 0) { throw "Installation failed" }
  register: git_install
  failed_when: git_install.rc != 0

- name: Verify Git installation
  win_stat:
    path: "C:\\Program Files\\Git\\cmd\\git.exe"
  register: git_verify
  changed_when: false
  failed_when: not git_verify.stat.exists

- name: Log Git installed
  debug:
    msg: "Git installed at C:\\Program Files\\Git\\cmd\\git.exe"

# ── GitHub Desktop ───────────────────────────────────────────────────────────
- name: Check if GitHub Desktop is already installed
  win_stat:
    path: "C:\\ProgramData\\chocolatey\\lib\\github-desktop"
  register: ghdesktop_stat
  changed_when: false

- name: Install GitHub Desktop via Chocolatey
  when: not ghdesktop_stat.stat.exists
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    choco install github-desktop --yes --no-progress --limit-output
    if ($LASTEXITCODE -ne 0) { throw "Installation failed" }
  register: ghdesktop_install
  failed_when: ghdesktop_install.rc != 0

- name: Log GitHub Desktop installed
  debug:
    msg: "GitHub Desktop installed successfully"

- name: Clear Chocolatey download cache
  win_shell: |
    choco cache remove --all --yes --no-progress 2>$null
  failed_when: false
  changed_when: false
