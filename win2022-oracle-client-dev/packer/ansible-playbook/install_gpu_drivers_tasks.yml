---
# ──────────────────────────────────────────────────────────────────────────────
# install_gpu_drivers_tasks.yml – NVIDIA GPU/vGPU GRID drivers from GCS
#
# Requires: NVIDIA GRID driver uploaded to gs://org-sec-agents-bucket/gpu/
# Note: The Packer build VM must use a GPU-enabled machine type (e.g. n1-standard-8
#       with --accelerator) for the driver to install correctly, or install in
#       "headless" mode for image preparation.
#
# Standard Ansible Windows modules: win_shell, win_stat, win_copy, win_find,
# win_file, win_command, debug
# ──────────────────────────────────────────────────────────────────────────────

- name: Create GPU driver temp directory
  win_file:
    path: "C:\\Temp\\gpu"
    state: directory

- name: Check if NVIDIA drivers are already installed
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    $nvidia = Get-ChildItem "C:\Program Files\NVIDIA Corporation" -ErrorAction SilentlyContinue
    if ($nvidia) { Write-Output "installed" } else { Write-Output "not_installed" }
  register: gpu_check
  changed_when: false

- name: Download NVIDIA GRID driver from GCS
  when: "'not_installed' in gpu_check.stdout"
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    gsutil cp gs://org-sec-agents-bucket/gpu/nvidia-grid-driver.exe C:\Temp\gpu\nvidia-grid-driver.exe
    if ($LASTEXITCODE -ne 0) { throw "Download failed" }
  register: gpu_download

- name: Install NVIDIA GRID driver silently
  when: "'not_installed' in gpu_check.stdout"
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    Start-Process -FilePath "C:\Temp\gpu\nvidia-grid-driver.exe" -ArgumentList "-s", "-noreboot" -Wait -NoNewWindow
    if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 1) { throw "Installation failed" }
  register: gpu_install

- name: Verify NVIDIA driver installation
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    $nvidia = Get-ChildItem "C:\Program Files\NVIDIA Corporation" -ErrorAction SilentlyContinue
    if (-not $nvidia) { exit 1 }
    $smi = Get-Command nvidia-smi -ErrorAction SilentlyContinue
    if ($smi) {
      & nvidia-smi --query-gpu=driver_version --format=csv,noheader 2>$null
    } else {
      Write-Output "NVIDIA drivers installed (nvidia-smi not available — GPU may not be attached during image build)"
    }
  register: gpu_verify
  changed_when: false

- name: Log GPU driver installation
  debug:
    msg: "{{ gpu_verify.stdout | trim }}"

- name: Clean up GPU driver temp files
  win_file:
    path: "C:\\Temp\\gpu"
    state: absent
  failed_when: false
