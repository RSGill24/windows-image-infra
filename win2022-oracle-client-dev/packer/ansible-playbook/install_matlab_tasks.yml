---
# ──────────────────────────────────────────────────────────────────────────────
# install_matlab_tasks.yml – MATLAB (binary installer from GCS)
#
# Requires:
#   - Installer: gs://org-sec-agents-bucket/matlab/matlab_installer.exe
#   - License file: gs://org-sec-agents-bucket/matlab/installer_input.txt
#     (contains license key, install dir, product selection)
#
# Standard Ansible Windows modules: win_shell, win_stat, win_copy, win_find,
# win_file, win_command, debug
# ──────────────────────────────────────────────────────────────────────────────

- name: Create MATLAB temp directory
  win_file:
    path: "C:\\Temp\\matlab"
    state: directory

- name: Check if MATLAB is already installed
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    $ml = Get-ChildItem "C:\Program Files\MATLAB" -ErrorAction SilentlyContinue
    if ($ml) { Write-Output "installed" } else { Write-Output "not_installed" }
  register: matlab_check
  changed_when: false

- name: Download MATLAB installer from GCS
  when: "'not_installed' in matlab_check.stdout"
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    gsutil cp gs://org-sec-agents-bucket/matlab/matlab_installer.exe C:\Temp\matlab\matlab_installer.exe
    if ($LASTEXITCODE -ne 0) { throw "Download failed" }
  register: matlab_dl_installer

- name: Download MATLAB license/input file from GCS
  when: "'not_installed' in matlab_check.stdout"
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    gsutil cp gs://org-sec-agents-bucket/matlab/installer_input.txt C:\Temp\matlab\installer_input.txt
    if ($LASTEXITCODE -ne 0) { throw "Download failed" }
  register: matlab_dl_license

- name: Install MATLAB silently
  when: "'not_installed' in matlab_check.stdout"
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    Start-Process -FilePath "C:\Temp\matlab\matlab_installer.exe" -ArgumentList "-inputFile", "C:\Temp\matlab\installer_input.txt", "-mode", "silent" -Wait -NoNewWindow
    if ($LASTEXITCODE -ne 0) { throw "Installation failed" }
  register: matlab_install

- name: Verify MATLAB installation
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    $matlab = Get-ChildItem "C:\Program Files\MATLAB" -Filter "matlab.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
    if (-not $matlab) { exit 1 }
    Write-Output $matlab.FullName
  register: matlab_bin
  changed_when: false

- name: Add MATLAB to system PATH
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    $matlabDir = (Get-ChildItem "C:\Program Files\MATLAB" -Filter "matlab.exe" -Recurse | Select-Object -First 1).DirectoryName
    $currentPath = [Environment]::GetEnvironmentVariable('PATH', 'Machine')
    if ($currentPath -notlike "*$matlabDir*") {
      [Environment]::SetEnvironmentVariable('PATH', "$currentPath;$matlabDir", 'Machine')
    }
  changed_when: false

- name: Log MATLAB installation success
  debug:
    msg: "MATLAB installed at: {{ matlab_bin.stdout | trim }}"

- name: Clean up MATLAB temp files
  win_file:
    path: "C:\\Temp\\matlab"
    state: absent
  failed_when: false
