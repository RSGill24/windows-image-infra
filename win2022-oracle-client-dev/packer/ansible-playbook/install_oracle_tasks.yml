---
# ──────────────────────────────────────────────────────────────────────────────
# install_oracle_tasks.yml – Oracle Instant Client from GCS
#
# Standard Ansible Windows modules: win_shell, win_stat, win_copy, win_find,
# win_file, win_command, debug
# ──────────────────────────────────────────────────────────────────────────────

- name: Create required directories
  win_file:
    path: "{{ item }}"
    state: directory
  loop:
    - "C:\\Temp"
    - "C:\\Temp\\oracle_extract"
    - "C:\\Oracle\\client"
    - "C:\\Oracle\\client\\network\\admin"

- name: Check if gsutil is available
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    gsutil version
    if ($LASTEXITCODE -ne 0) { exit 1 }
  register: gsutil_check
  failed_when: false
  changed_when: false

- name: Install Google Cloud SDK if gsutil is missing
  when: gsutil_check.rc != 0
  block:
    - name: Download Google Cloud SDK installer
      win_shell: |
        $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
        $client = New-Object System.Net.WebClient
        $client.DownloadFile("https://dl.google.com/dl/cloudsdk/channels/rapid/GoogleCloudSDKInstaller.exe", "C:\Temp\GoogleCloudSDKInstaller.exe")

    - name: Install Google Cloud SDK silently
      win_shell: |
        $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
        Start-Process -FilePath "C:\Temp\GoogleCloudSDKInstaller.exe" -ArgumentList "/S", "/allusers" -Wait -NoNewWindow

    - name: Verify gsutil after install
      win_shell: |
        $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
        gsutil version
        if ($LASTEXITCODE -ne 0) { exit 1 }
      register: gsutil_verify

- name: Download Oracle Instant Client Basic from GCS
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    gsutil cp gs://org-sec-agents-bucket/oracle/instantclient-basic-windows.x64-19.30.0.0.0dbru.zip C:\Temp\oracle-basic.zip
    if ($LASTEXITCODE -ne 0) { throw "Download failed" }
  register: basic_download

- name: Download Oracle SQL*Plus from GCS
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    gsutil cp gs://org-sec-agents-bucket/oracle/instantclient-sqlplus-windows.x64-19.30.0.0.0dbru.zip C:\Temp\oracle-sqlplus.zip
    if ($LASTEXITCODE -ne 0) { throw "Download failed" }
  register: sqlplus_download

- name: Verify oracle-basic.zip downloaded
  win_stat:
    path: "C:\\Temp\\oracle-basic.zip"
  register: basic_zip_stat
  changed_when: false
  failed_when: not basic_zip_stat.stat.exists

- name: Verify oracle-sqlplus.zip downloaded
  win_stat:
    path: "C:\\Temp\\oracle-sqlplus.zip"
  register: sqlplus_zip_stat
  changed_when: false
  failed_when: not sqlplus_zip_stat.stat.exists

- name: Extract Oracle packages
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    Expand-Archive -Path "C:\Temp\oracle-basic.zip" -DestinationPath "C:\Temp\oracle_extract" -Force
    Expand-Archive -Path "C:\Temp\oracle-sqlplus.zip" -DestinationPath "C:\Temp\oracle_extract" -Force

- name: Find extracted Oracle directory
  win_command: cmd /c dir /b /ad "C:\Temp\oracle_extract\instantclient*"
  register: oracle_extracted_dir
  changed_when: false
  failed_when: oracle_extracted_dir.rc != 0

- name: Copy Oracle files to installation directory
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    $src = "C:\Temp\oracle_extract\{{ oracle_extracted_dir.stdout_lines[0] | trim }}"
    Get-ChildItem -Path $src | Copy-Item -Destination "C:\Oracle\client" -Recurse -Force

- name: Set Oracle environment variables and PATH
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    [Environment]::SetEnvironmentVariable('ORACLE_HOME', 'C:\Oracle\client', 'Machine')
    [Environment]::SetEnvironmentVariable('TNS_ADMIN', 'C:\Oracle\client\network\admin', 'Machine')
    $path = [Environment]::GetEnvironmentVariable('PATH', 'Machine')
    if ($path -notlike '*Oracle*client*') {
      [Environment]::SetEnvironmentVariable('PATH', $path + ';C:\Oracle\client', 'Machine')
    }

- name: Remove temporary files
  win_file:
    path: "{{ item }}"
    state: absent
  loop:
    - "C:\\Temp\\oracle-basic.zip"
    - "C:\\Temp\\oracle-sqlplus.zip"
    - "C:\\Temp\\oracle_extract"
    - "C:\\Temp\\GoogleCloudSDKInstaller.exe"
  failed_when: false

- name: Verify DLLs present
  win_command: cmd /c dir /b "C:\Oracle\client\*.dll"
  register: oracle_dlls
  changed_when: false
  failed_when: oracle_dlls.rc != 0

- name: Verify sqlplus.exe present
  win_stat:
    path: "C:\\Oracle\\client\\sqlplus.exe"
  register: sqlplus_stat
  changed_when: false
  failed_when: not sqlplus_stat.stat.exists
