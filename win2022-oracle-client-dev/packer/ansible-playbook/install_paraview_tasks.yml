---
# ──────────────────────────────────────────────────────────────────────────────
# install_paraview_tasks.yml – ParaView via Chocolatey
# ──────────────────────────────────────────────────────────────────────────────

- name: Bootstrap Chocolatey (ParaView)
  include_tasks: bootstrap_chocolatey_tasks.yml

- name: Check if ParaView is already installed
  win_shell: |
    $pv = Get-ChildItem "C:\Program Files" -Filter "ParaView*" -Directory -ErrorAction SilentlyContinue
    if ($pv) { echo "installed" } else { echo "not_installed" }
  register: paraview_check
  changed_when: false

- name: Install ParaView via Chocolatey
  when: "'not_installed' in paraview_check.stdout"
  win_shell: |
    choco install paraview --yes --no-progress --limit-output
    if ($LASTEXITCODE -ne 0) { throw "ParaView installation failed with exit code $LASTEXITCODE" }
  register: paraview_install
  failed_when: paraview_install.rc != 0

- name: Verify ParaView installation
  win_shell: |
    $searchPaths = @(
      "C:\Program Files",
      "C:\Program Files (x86)",
      "C:\ProgramData\chocolatey\lib\paraview",
      "C:\ProgramData\chocolatey\bin"
    )
    foreach ($path in $searchPaths) {
      $pv = Get-ChildItem $path -Filter "paraview.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
      if ($pv) { echo $pv.FullName; exit 0 }
    }
    echo "NOT_FOUND"
  register: paraview_bin
  changed_when: false

- name: Log ParaView installation success
  debug:
    msg: "ParaView installed at: {{ paraview_bin.stdout | trim }}"
  when: "'NOT_FOUND' not in paraview_bin.stdout"

- name: Warn if ParaView exe not found
  debug:
    msg: "WARNING: ParaView package installed via Chocolatey but paraview.exe not found. This may happen on Windows Server — manual install may be required."
  when: "'NOT_FOUND' in paraview_bin.stdout"

- name: Clear Chocolatey download cache
  win_shell: |
    choco cache remove --all --yes --no-progress 2>$null
  failed_when: false
  changed_when: false
