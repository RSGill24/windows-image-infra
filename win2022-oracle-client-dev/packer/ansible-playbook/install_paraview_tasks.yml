---
# ──────────────────────────────────────────────────────────────────────────────
# install_paraview_tasks.yml – ParaView via GCS bucket download
# ──────────────────────────────────────────────────────────────────────────────

- name: Check if ParaView is already installed
  win_shell: |
    $pv = Get-ChildItem "C:\Program Files" -Filter "paraview.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
    if ($pv) { echo "installed" } else { echo "not_installed" }
  register: paraview_check
  changed_when: false

- name: Download ParaView MSI from GCS
  when: "'not_installed' in paraview_check.stdout"
  win_shell: |
    $dest = "C:\Windows\Temp\ParaView.msi"
    gsutil cp "gs://org-sec-agents-bucket/ParaView-6.2.0-RC1-Windows-Python3.12-msvc2017-AMD64.msi" $dest
    if (-not (Test-Path $dest)) { throw "ParaView download from GCS failed" }
    $size = [math]::Round((Get-Item $dest).Length / 1MB, 1)
    echo "Downloaded ParaView MSI ($size MB)"
  register: paraview_download
  failed_when: paraview_download.rc != 0

- name: Install ParaView MSI silently
  when: "'not_installed' in paraview_check.stdout and paraview_download.rc == 0"
  win_shell: |
    $msi = "C:\Windows\Temp\ParaView.msi"
    $proc = Start-Process msiexec.exe -ArgumentList "/i", $msi, "/qn", "/norestart" -Wait -NoNewWindow -PassThru
    Write-Host "msiexec exit code: $($proc.ExitCode)"
    echo "ParaView installation completed"
  register: paraview_install
  failed_when: paraview_install.rc != 0

- name: Clean up ParaView MSI installer
  win_file:
    path: "C:\\Windows\\Temp\\ParaView.msi"
    state: absent
  failed_when: false

- name: Verify ParaView installation
  win_shell: |
    $pv = Get-ChildItem "C:\Program Files" -Filter "paraview.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
    if ($pv) { echo $pv.FullName } else { echo "NOT_FOUND" }
  register: paraview_bin
  changed_when: false

- name: Log ParaView installation result
  debug:
    msg: "ParaView installed at: {{ paraview_bin.stdout | trim }}"
  when: "'NOT_FOUND' not in paraview_bin.stdout"

- name: Warn if ParaView not found after install
  debug:
    msg: "WARNING: ParaView MSI ran but paraview.exe not found — may need manual verification."
  when: "'NOT_FOUND' in paraview_bin.stdout"
