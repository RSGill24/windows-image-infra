---
# ──────────────────────────────────────────────────────────────────────────────
# install_python_tasks.yml – Standalone Python via Chocolatey
#
# Standard Ansible Windows modules: win_shell, win_stat, win_copy, win_find,
# win_file, win_command, debug
# ──────────────────────────────────────────────────────────────────────────────

- name: Bootstrap Chocolatey (Python)
  include_tasks: bootstrap_chocolatey_tasks.yml

# ── Python ───────────────────────────────────────────────────────────────────
- name: Check if Python is already installed
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    $py = Get-Command python -ErrorAction SilentlyContinue
    if ($py) { Write-Output "installed" } else { Write-Output "not_installed" }
  register: python_check
  changed_when: false

- name: Install Python via Chocolatey
  when: "'not_installed' in python_check.stdout"
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    choco install python --yes --no-progress --limit-output
    if ($LASTEXITCODE -ne 0) { throw "Installation failed" }
  register: python_install
  failed_when: python_install.rc != 0

- name: Verify Python installation
  win_shell: |
    $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
    python --version
    if ($LASTEXITCODE -ne 0) { exit 1 }
  register: python_version
  changed_when: false

- name: Log Python version
  debug:
    msg: "Python version: {{ python_version.stdout | trim }}"

- name: Clear Chocolatey download cache
  win_shell: |
    choco cache remove --all --yes --no-progress 2>$null
  failed_when: false
  changed_when: false
