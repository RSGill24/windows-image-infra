---
- name: Phase 2 - Database Customization via Ansible
  hosts: all
  gather_facts: yes
  vars:
    database_type: "{{ database_type | default('none') }}"
    installation_target_dir: "C:/Users/packer_user/installation/"

  tasks:
    - name: Display Database Installation Information
      debug:
        msg: |
          Database Type: {{ database_type }}
          Target Directory: {{ installation_target_dir }}
          Ansible Host: {{ inventory_hostname }}
          Connection: WinRM

    - name: Install MySQL Client
      include_tasks: install_mysql_tasks.yml
      when: database_type | lower == 'mysql'

    - name: Install Oracle Client
      include_tasks: install_oracle_tasks.yml
      when: database_type | lower == 'oracle'

    - name: Show Database Installation Status
      debug:
        msg: |
          Database Type: {{ database_type }}
          Status: SUCCESS
