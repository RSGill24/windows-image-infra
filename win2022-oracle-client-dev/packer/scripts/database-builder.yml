---
# Phase 2: Database Customization Playbook
# This playbook can be used for additional orchestration and validation
# Runs on the Linux side (Docker container) before/after Packer

- name: Phase 2 Database Image Builder Preparation
  hosts: localhost
  gather_facts: yes
  vars:
    project_id: "{{ lookup('env', 'PROJECT_ID') }}"
    database_type: "{{ lookup('env', 'DATABASE_TYPE') | default('none') }}"
    source_image_family: "{{ lookup('env', 'SOURCE_IMAGE_FAMILY') }}"
    image_family: "{{ lookup('env', 'IMAGE_FAMILY') }}"
    packer_template: "customize_db.pkr.hcl"

  tasks:
    - name: Display Phase 2 Build Information
      debug:
        msg: |
          ╔════════════════════════════════════════════════╗
          ║   Phase 2: Database Customization Builder      ║
          ╠════════════════════════════════════════════════╣
          ║ Project ID: {{ project_id }}
          ║ Database Type: {{ database_type }}
          ║ Source Image Family: {{ source_image_family }}
          ║ Target Image Family: {{ image_family }}
          ║ Packer Template: {{ packer_template }}
          ╚════════════════════════════════════════════════╝

    - name: Validate Environment Variables
      assert:
        that:
          - project_id | length > 0
          - source_image_family | length > 0
          - image_family | length > 0
        fail_msg: "Required environment variables not set"
        success_msg: "All required environment variables present"

    - name: Validate Database Type
      assert:
        that:
          - database_type in ['mysql', 'oracle', 'none']
        fail_msg: "DATABASE_TYPE must be 'mysql', 'oracle', or 'none'"
        success_msg: "Database type '{{ database_type }}' is valid"

    - name: Check Packer Installation
      shell: packer version
      register: packer_version
      ignore_errors: no

    - name: Display Packer Version
      debug:
        msg: "{{ packer_version.stdout }}"

    - name: Check GCloud Installation
      shell: gcloud --version
      register: gcloud_version
      ignore_errors: no

    - name: Display GCloud Version
      debug:
        msg: "{{ gcloud_version.stdout_lines[0] }}"

    - name: Verify Packer Template Exists
      stat:
        path: "/workspace/{{ packer_template }}"
      register: packer_file
      failed_when: not packer_file.stat.exists

    - name: Verify Database Scripts Exist
      stat:
        path: "/workspace/{{ item }}"
      register: script_files
      loop:
        - config.yaml
      failed_when: script_files.results | selectattr('stat.exists', 'false') | list | length > 0

    - name: Display Database Scripts Validation
      debug:
        msg: |
          Scripts validated:
          ✓ config.yaml

    - name: Initialize Packer Plugins
      shell: cd /workspace && packer init {{ packer_template }}
      environment:
        PACKER_LOG: "1"

    - name: Validate Packer Template Syntax
      shell: |
        cd /workspace
        packer validate \
          -var "project_id={{ project_id }}" \
          -var "database_type={{ database_type }}" \
          {{ packer_template }}
      register: packer_validate
      environment:
        PACKER_LOG: "1"

    - name: Display Packer Validation Result
      debug:
        msg: "{{ packer_validate.stdout }}"

    - name: Pre-flight Check Summary
      debug:
        msg: |
          ╔════════════════════════════════════════════════╗
          ║   Pre-flight Checks Completed Successfully      ║
          ╠════════════════════════════════════════════════╣
          ║ ✓ Environment variables validated
          ║ ✓ Database type valid: {{ database_type }}
          ║ ✓ Packer installed: {{ packer_version.stdout_lines[0] if packer_version.stdout_lines else 'OK' }}
          ║ ✓ GCloud configured
          ║ ✓ Packer template syntax valid
          ║ ✓ Database scripts present
          ║
          ║ Ready for Packer build execution
          ╚════════════════════════════════════════════════╝
